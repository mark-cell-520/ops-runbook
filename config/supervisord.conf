[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; ======================
; 2026-10-29 冻结修复（全局 glibc arena 收敛）
; ======================
; 根因证据（/root/.hermes/logs/agent.log + gui.log）：
;   memory trim: ... malloc_trim=1 ... duration_ms=205612.3
;   web_server: event loop stalled 205.0s / 282.2s (GIL pressure suspected)
;   gateway.shutdown_watchdog: missed 3 consecutive liveness probes; exit 75
; 机理：MALLOC_ARENA_MAX 未设置 → glibc 默认 8 × nproc = 8 × 128 = 1024 个
; arena，每个在 64MB 边界扩展 → 堆膨胀；hermes mem_trim 每 60s 调一次
; malloc_trim(0)，要遍历全部 1024 个 arena 并 madvise → 单次 205 秒 →
; gateway liveness 连续 3 次未响应 → exit 75 自杀重启；dashboard 事件循环
; drift 最大 282s，用户侧即"整体环境卡死"。
; 内核态治理在本容器 100% 不可行：/sys/fs/cgroup 挂载为 ro（写不了
; memory.high），/proc/sys/vm/{swappiness,overcommit_memory,drop_caches,
; compact_memory} 全部 READONLY，cgroup memory.swap.max=0 → 无 swap。
; 因此只能用户态收敛：把 arena 数压到 2，堆面积缩到 1/512，malloc_trim
; 从 205 秒降到毫秒级；同时把 BLAS/OpenMP 线程数压进 cpu.max 的 2 核配额
; （cpu.max 200000/100000，实测 nr_throttled/nr_periods = 92/71127 = 0.13%，
; CPU 本身不是瓶颈，这是为了避免线程爆炸叠加内存膨胀）。
; 已否决 /etc/ld.so.preload 注入 mallopt(M_ARENA_MAX)：一个不兼容 .so
; 会让容器内所有二进制启动失败，风险过高。

; ======================
; nginx
; ======================
; 2026-10-29: autostart=false. The container entrypoint (PID 1) already runs
; `service nginx restart`, which binds 80/443 as its own daemon (that master is
; what actually serves traffic). A second nginx here can only fail: it got
; EADDRINUSE, exited, and `autorestart=true` retried every ~3.5s — 18054 failed
; attempts by 2026-10-29 07:27, each forking `worker_processes auto` = 129
; workers on a 2-core cgroup (cpu.max 200000/100000). That is ~2.3M short-lived
; processes burned for zero traffic, and it is a large part of the load average
; and cgroup pressure on this box. service-watchdog.sh now guards 80/443 and
; starts nginx only if nothing is listening, so removing autostart here loses no
; protection.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/var/log/nginx.out.log
stderr_logfile=/var/log/nginx.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; ======================
; filebrowser
; ======================
; 2026-10-29: autostart=false, for the same reason as nginx — the entrypoint
; already runs its own filebrowser (with --username/--password) on 8080. This
; copy is `--noauth` and binds nothing: it sat at 6 fds, no listening socket,
; parked in futex_wait, while supervisord reported it RUNNING. Worse, its
; `rm -f /app/filebrowser.db` ran on every (re)start, repeatedly deleting the
; database the live instance was using. Kept in the file for reference only.
[program:filebrowser]
command=/bin/bash -c "rm -f /app/filebrowser.db && /app/filebrowser -a 0.0.0.0 -r /root -d /app/filebrowser.db --baseurl /fb --noauth"
priority=20
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/var/log/filebrowser.out.log
stderr_logfile=/var/log/filebrowser.err.log

; ======================
; web-shell
; ======================
[program:web-shell]
command=/bin/bash -c "mkdir -p /root-cmd && exec /app/web-shell -s -cp /shell -P 9090 -w /root-cmd bash"
; 2026-10-29 冻结修复：MALLOC_ARENA_MAX 见文件顶部 [supervisord] 段注释。
; 该进程是 Go 写的，glibc arena 不适用，但 OMP/线程上限统一压到 2 核配额内。
environment=MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",NUMEXPR_NUM_THREADS="2"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/web-shell.out.log
stderr_logfile=/var/log/web-shell.err.log
; ======================
; hermes-webui
; ======================
[program:hermes-webui]
; 2026-10-29 搬迁修复（解释器也必须一起换，不能只加 HERMES_HOME）：
; 原命令用的是旧安装的 /root/.hermes/tools/.../bin/python3。只要 HERMES_HOME 指向
; /root/hermes1，hermes 的 venv_sync.prepare_launch 就会拿"当前解释器 vs 目标 venv"
; 做版本比对：hermes1/hermes-agent/venv 是 python3.11 的，而这个解释器是 3.14 →
; 判定 venv 不是当前状态 → os.execv 重启成
;   python3 -I -c '…runpy.run_path("/app/hermes-webui/server.py", run_name="__main__")'
; `-I`（isolated）隐含 `-E`，既丢掉 PYTHONPATH 也不把脚本所在目录放进
; sys.path（实测 sys.path[:4] 只有 /root/hermes1/hermes-agent + stdlib zip），
; 于是 server.py 第 17 行 `from api.auth import check_auth` 直接
; ModuleNotFoundError: No module named 'api'，webui 进 BACKOFF 反复重启。
; 换成 hermes1 自带的 store 解释器后版本一致，prepare_launch 返回 None（不重启），
; server.py 按普通脚本跑，sys.path[0] 就是 /app/hermes-webui，一切正常。
command=/root/hermes1/tools/python-3.14.9+20261021-linux-x64/bin/python3 /app/hermes-webui/server.py
directory=/app/hermes-webui
; CPython 用 glibc arena，且自身多线程（线程池 + asyncio），
; arena 收敛直接消除堆膨胀导致的 malloc_trim 长尾。
; 2026-10-29 搬迁修复：hermes-webui 是独立项目（自带 .git/README/Dockerfile），
; 不随 hermes 升级，所以没搬进 /root/hermes1；但它读的 HERMES_HOME 默认值是
; `$HOME/.hermes`，而 hermes 已整体迁到 /root/hermes1 —— 不显式指定的话这个
; 8787 端口服务的一直是旧安装的状态（旧 config.yaml / auth.json / state.db /
; 旧 hermes-agent）。hermes1/webui/ 已随整体搬迁一并复制，内容与旧目录一致，
; 因此直接切过去不会丢 webui 自己的状态（.signing_key / settings.json /
; sessions/ / workspace/ 都在）。
environment=MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",NUMEXPR_NUM_THREADS="2",HERMES_HOME="/root/hermes1",HERMES_WEBUI_STATE_DIR="/root/hermes1/webui"
priority=40
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/hermes-webui.out.log
stderr_logfile=/var/log/hermes-webui.err.log

; ======================
; added 2026-10-28: persistence via watchdog (manages feishu-bridge + hermes-gateway)
; ======================
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:service-watchdog]
command=/bin/bash /root/.local/bin/service-watchdog.sh
; 守护脚本本身是 bash，arena 无关；但它是 hermes-gateway / feishu-bridge 的
; 父进程，环境变量会经 exec 传给这两个被守护进程——那两个才是 arena 大头。
; service-watchdog.sh 内部也显式 export 了同一组变量做双保险。
environment=MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",NUMEXPR_NUM_THREADS="2"
autostart=true
autorestart=true
startsecs=5
startretries=20
priority=30
stdout_logfile=/var/log/service-watchdog.sup.out.log
stderr_logfile=/var/log/service-watchdog.sup.err.log

[program:hermes-dashboard]
; 2026-10-29 搬迁修复：hermes 已整体迁到 /root/hermes1，/root/.local/bin/hermes 是
; 刻意拦掉 `dashboard`/`gateway`/`config set model.*` 的 stub（防顶层容器入口脚本
; 重启后把模型重置成 cephalon/minimax），直接用它启动只会 exit 0 —— 所以
; supervisorctl 一直显示 hermes-dashboard STOPPED Oct 29 04:55 PM。改指真正的
; /root/hermes1/hermes，它自带 HERMES_HOME=/root/hermes1。
command=/root/hermes1/hermes dashboard --port 9119 --no-open --skip-build
directory=/root
; dashboard 就是 mem_trim 与 event loop stall 的发生地（agent.log / gui.log
; 里 47 条 "event loop stalled" 全部来自这里），arena 收敛是直接对症的。
environment=MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",NUMEXPR_NUM_THREADS="2"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/hermes-dashboard.log
stderr_logfile=/var/log/hermes-dashboard.err.log

; ======================
; hermes-gateway
; ======================
; 2026-10-29 搬迁修复：service-watchdog.sh 里管 hermes-gateway 的整段（fix_model_config /
; gateway_up / 冷却闸门）在迁移时已删除，PID 1 的顶层入口脚本也够不到 /root/hermes1，
; 结果是"没有任何东西在开机时把 gateway 拉起来"——飞书长连接、cron、本地会话恢复全都没有。
; 这里补上：直接用 /root/hermes1/hermes（自带 HERMES_HOME=/root/hermes1）。
[program:hermes-gateway]
command=/root/hermes1/hermes gateway
directory=/root
; 见 [supervisord] 段顶部 2026-10-29 冻结修复注释：arena/线程数收敛是 hermes 内存
; 与 event-loop stall 的直接对症项，gateway 曾是最大头。
environment=MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",NUMEXPR_NUM_THREADS="2"
priority=35
autostart=true
autorestart=true
; gateway 冷启动到连上飞书要 10s+，startsecs 给足，否则会被判启动失败而重启。
startsecs=15
startretries=10
; 优雅停机要跑完 drain（config.yaml agent.restart_drain_timeout: 60）。
stopwaitsecs=90
stdout_logfile=/var/log/hermes-gateway.log
stderr_logfile=/var/log/hermes-gateway.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

; ======================
; nascab (NasCabOS server, headless/clientless mode)
; ======================
[program:nascab]
; 注意这个 node 路径：hermes 已于 2026-10-29 整体迁到 /root/hermes1，而这里仍指向
; 搬迁前的 /root/.hermes/node。两者目前都是 v22.22.2，所以服务是好的，但只要
; /root/.hermes 哪天被清理掉，nascab 和 heartflow-mcp 会同时起不来。
; 搬迁后更一致的选择是 /root/hermes1/node/bin/node（同一版本）。要改的话：
;   supervisorctl -c /etc/supervisord.conf restart nascab heartflow-mcp
; 本文件是 /etc/supervisord.conf 的忠实副本，所以改这里之前先确认线上这一行。
command=/root/.hermes/node/bin/node src/main_nascab_os.js
directory=/app/nascab/repo/electron_server
environment=NODE_USE_ENV_PROXY="1",NODE_ENV="production",userDataFolder="/app/nascab/data",MALLOC_ARENA_MAX="2",UV_THREADPOOL_SIZE="2",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",NUMEXPR_NUM_THREADS="2"
priority=45
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/var/log/nascab.out.log
stderr_logfile=/var/log/nascab.err.log
; Cap the logs: logrotate is not installed here, and the official Docker doc
; warns that unbounded nascab logs balloon on real NAS use
; (--log-opt max-size=10m --log-opt max-file=3). supervisord rotates natively.
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

; ======================
; heartflow-mcp (心虫判别引擎 MCP, v6.8.59)
; 源码: /root/hermes1/skills/ai/mark-heartflow-skill (2026-10-18 备份恢复)
; token 与 .mcp.env 固定值一致; Hermes 侧已注册 mcp_servers.heartflow
; ======================
[program:heartflow-mcp]
; 同上：代码目录已经在 /root/hermes1/skills/...，node 却还取自 /root/.hermes。
command=/root/.hermes/node/bin/node src/mcp-server.js --port 8588
directory=/root/hermes1/skills/ai/mark-heartflow-skill
environment=HEARTFLOW_MCP_TOKEN="<REDACTED:与 /root/hermes1/.mcp.env 保持一致，见 secrets/README.md>",MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2",MKL_NUM_THREADS="2",NUMEXPR_NUM_THREADS="2"
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stdout_logfile=/var/log/heartflow-mcp.log
stderr_logfile=/var/log/heartflow-mcp.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
